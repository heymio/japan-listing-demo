name: Release validated japan-listing-demo

on:
  workflow_run:
    workflows: ["Validate japan-listing-demo skill"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      tag: ${{ steps.meta.outputs.tag }}
      validated_sha: ${{ steps.meta.outputs.validated_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact validated SHA is still current main
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          echo "validated_sha=$VALIDATED_SHA" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_MAIN" != "$VALIDATED_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Validated SHA is stale; current main is $CURRENT_MAIN"
            exit 0
          fi
          VERSION="$(cat VERSION)"
          if [ "$VERSION" != "0.3.3" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Validated release workflow is inactive for VERSION=$VERSION"
            exit 0
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build deterministic release archives
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .agents/skills/japan-listing-demo/scripts/package_skill.py
          python3 scripts/package_codex_bundle.py
          python3 -m zipfile -l dist/japan-listing-demo.skill.zip >/dev/null
          python3 -m zipfile -l dist/japan-listing-demo-codex-bundle.zip >/dev/null

      - name: Create download-local checksums and release metadata
        if: steps.meta.outputs.publish == 'true'
        env:
          VALIDATED_SHA: ${{ steps.meta.outputs.validated_sha }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum \
            japan-listing-demo.skill.zip \
            japan-listing-demo-codex-bundle.zip \
            > SHA256SUMS.txt)
          cp docs/release-notes-v0.3.3.md dist/RELEASE_NOTES.md
          jq -n \
            --arg validated_sha "$VALIDATED_SHA" \
            --arg tag "$TAG" \
            '{validated_sha:$validated_sha,tag:$tag}' \
            > dist/RELEASE_METADATA.json

      - uses: actions/upload-artifact@v4
        if: steps.meta.outputs.publish == 'true'
        with:
          name: release-candidate-${{ steps.meta.outputs.tag }}-${{ steps.meta.outputs.validated_sha }}
          path: |
            dist/japan-listing-demo.skill.zip
            dist/japan-listing-demo-codex-bundle.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
            dist/RELEASE_METADATA.json

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ needs.build.outputs.tag }}-${{ needs.build.outputs.validated_sha }}
          path: release

      - name: Verify candidate still targets exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ needs.build.outputs.validated_sha }}
          TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          META_SHA="$(jq -r '.validated_sha' release/RELEASE_METADATA.json)"
          META_TAG="$(jq -r '.tag' release/RELEASE_METADATA.json)"
          test "$META_SHA" = "$VALIDATED_SHA"
          test "$META_TAG" = "$TAG"
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$CURRENT_MAIN" = "$VALIDATED_SHA"
          (cd release && sha256sum -c SHA256SUMS.txt)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no second publication."
            exit 0
          fi

          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$VALIDATED_SHA" ]; then
            echo "Existing tag $TAG points to unexpected SHA $TAG_SHA" >&2
            exit 1
          fi

          gh release create "$TAG" \
            --target "$VALIDATED_SHA" \
            --title "$TAG — Fail-Closed Hard Verification" \
            --notes-file release/RELEASE_NOTES.md \
            release/japan-listing-demo.skill.zip \
            release/japan-listing-demo-codex-bundle.zip \
            release/SHA256SUMS.txt
