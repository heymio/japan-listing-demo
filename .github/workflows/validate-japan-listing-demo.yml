name: Validate japan-listing-demo skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .agents/skills/japan-listing-demo/scripts/validate_overlay.py
      - run: python .agents/skills/japan-listing-demo/scripts/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: japan-listing-demo-skill
          path: dist/japan-listing-demo.skill.zip
