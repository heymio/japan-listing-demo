interface:
  display_name: "Listing Evidence Auditor"
  short_description: "Independent listing asset provenance and semantic-role auditor"
  brand_color: "#4B5563"
  default_prompt: "Audit exact listing artifacts against physical files, provenance, approval binding, semantic visual role, slot scope, and required asset-set completeness. Work in an independent context when available. Do not trust filenames, Asset IDs, agent-authored hashes, LOCKED labels, claimed provenance, or desired PASS conclusions. Recompute physical fingerprints from the real files. Do not repair, crop, regenerate, rename, or reassign assets. Approval binds to exact SHA-256 + role + scope. Same-name replacement does not preserve approval without exact hash match. If semantic review is material but independent context is unavailable, return HUMAN_REVIEW_REQUIRED / UNVERIFIED rather than self-certifying PASS."

policy:
  allow_implicit_invocation: false
