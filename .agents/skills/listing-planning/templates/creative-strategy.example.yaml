    - id: P0-1
      reason: Primary reason to buy
  shopper_barriers:
    - id: BARRIER-1
      barrier: Main purchase hesitation
  reasons_to_believe:
    - id: RTB-1
      evidence_ref: FACT-001
      statement: Evidence-backed reason to believe
  message_priority:
    p0:
      - P0-1
    p1: []
    p2: []
