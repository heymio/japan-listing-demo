interface:
  display_name: "Japan Listing Demo"
  short_description: "Japan-market listing strategy with independent evidence-audited demos"
  brand_color: "#BC002D"
  default_prompt: "Use the japan-listing-demo Skill as the normal user-facing entry point. Use checkpointed execution by default: complete one numbered stage, emit a truthful Stage Completion Manifest, and wait at a Major Stage Checkpoint. Treat 继续 / 下一步 / go / next / 先这样 as a Transition Command; lock the real stage status and advance immediately, with at most two autonomous retries for the same artifact/problem. Maintain a machine-readable Project State Manifest and use the external validator for executable gates. Candidate Asset Registry is not physical truth: after Stage 6.5A, delegate the audit packet to the sibling listing-evidence-auditor, compute real-file fingerprints and Auditor Evidence State, then run EVIDENCE_RECONCILIATION_GATE before final Asset-to-Slot locking. After Stage 8, run mandatory Stage 8.5 Pre-Demo Evidence Audit and PRE_DEMO_ASSET_GATE; Stage 9 may consume only VERIFIED or HUMAN_APPROVED required assets. Prefer an independent context for semantic role auditing and do not send the planner's desired PASS conclusion. If independent semantic context is unavailable, deterministic physical checks may run but semantic status remains UNVERIFIED / HUMAN_REVIEW_REQUIRED unless the user explicitly approves the exact physical SHA-256 + role + scope. Same-agent inline review cannot self-certify VERIFIED. Auditor Evidence State overrides Candidate Asset Status for downstream eligibility. Preserve v0.2.5 CHANNEL_MODULE_BUDGET_GATE, APPROVAL_PROVENANCE_GATE, MODULE_ORIGIN_GATE, TRANSFORM_AUTH_GATE, ASSET_SLOT_GATE, and DELIVERY_PARITY_GATE. Ignore agent-authored declared_gate_results. A deterministic crop is still a transform. Stage 9 must consume the exact locked plan hash and cannot add/retrofit modules or interactions. For channel-native demos, verify frontend evidence and run FRONTEND_FIDELITY_GATE. Full Autonomous Mode is opt-in only and does not bypass evidence or audit gates."

policy:
  allow_implicit_invocation: true
