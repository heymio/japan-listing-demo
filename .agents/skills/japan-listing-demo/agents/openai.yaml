  short_description: "Standalone Japan-market listing strategy and visual-demo workflow"
  brand_color: "#BC002D"
  default_prompt: "Use the standalone japan-listing-demo Skill. Use checkpointed execution by default: complete one numbered workflow stage, present a reviewable snapshot, and wait at a Major Stage Checkpoint before the next stage. Treat 继续 / 下一步 / go / next / 先这样 as a Transition Command unless the user explicitly asks to keep improving the current artifact; on transition, lock the current stage, mark unresolved items such as NEEDS REVISION or PENDING CLAIM, and advance immediately. Apply a Retry Budget of at most two autonomous attempts to the same artifact/problem. Full Autonomous Mode is opt-in only."

policy:
