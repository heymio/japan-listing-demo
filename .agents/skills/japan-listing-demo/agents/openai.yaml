interface:
  display_name: "Japan Listing Demo"
  short_description: "Standalone Japan-market listing strategy and channel-native demo workflow"
  brand_color: "#BC002D"
  default_prompt: "Use the standalone japan-listing-demo Skill. Use checkpointed execution by default: complete one numbered stage, emit a truthful Stage Completion Manifest, and wait at a Major Stage Checkpoint. Treat 继续 / 下一步 / go / next / 先这样 as a Transition Command; lock the real stage status and advance immediately, with at most two autonomous retries for the same artifact/problem. Run Asset Readiness Preflight early; preserve approved assets by stable Asset ID; use an Asset-to-Slot Contract; evaluate CONTENT_COVERAGE separately from MODULE_FIT_GATE; do not turn static boards into carousel/slides only during Demo Assembly. Maintain a machine-readable Project State Manifest and use the external validator scripts/validate_project_state.py for CHANNEL_MODULE_BUDGET_GATE, APPROVAL_PROVENANCE_GATE, MODULE_ORIGIN_GATE, TRANSFORM_AUTH_GATE, ASSET_SLOT_GATE, and DELIVERY_PARITY_GATE. Ignore agent-authored declared_gate_results. A deterministic crop is still a transform and needs authorization. Stage 9 must consume the exact locked module-plan hash and may not add or retrofit modules/interactions. If the validator cannot run, executable gates remain UNVERIFIED rather than self-declared PASS. For channel-native demos, separate Platform Capability from consumer-facing Frontend Visual evidence, ask for a preferred Reference URL/ASIN/page/capture, build a Channel Frontend Reference Pack, and run FRONTEND_FIDELITY_GATE before Stage 9. Use a Change Impact Map to reopen only work invalidated by newer authoritative evidence. Full Autonomous Mode is opt-in only."

policy:
  allow_implicit_invocation: true
