distribution: standalone
distribution_version: 0.2.6
upstream:
  repository: heymio/gtm-listing-demo
  version: 0.2.0
  commit: b882526f5a683235d30f562006cf1984a9f0d9f9
snapshot_scope:
  - workflow
  - contracts
  - market-research
  - localization
  - visual-evidence
  - qa
  - category-template
  - core-evals
distribution_patches:
  - id: checkpointed-execution-v0.2.2
    purpose: use major-stage human checkpoints by default while preventing repeated frame/subtask loops; transition commands advance immediately and repeated artifact retries are bounded
    files:
      - core/workflow.md
      - SKILL.md
      - agents/openai.yaml
  - id: channel-native-demo-fidelity-v0.2.3
    purpose: require current consumer-facing frontend references and a Frontend Fidelity Gate before labeling or assembling channel-native demos
    files:
      - core/workflow.md
      - core/qa.md
      - SKILL.md
      - agents/openai.yaml
      - references/channel-native-demo.md
      - references/qa.md
      - profiles/channels/amazon-jp.md
      - profiles/channels/rakuten.md
      - profiles/channels/yahoo-shopping.md
      - profiles/channels/dtc.md
      - profiles/channels/retailer-pdp.md
  - id: delivery-integrity-v0.2.4
    purpose: prevent false stage completion, silent asset substitution, cross-slot leakage, module-fit errors, interaction drift, weak differentiator proof, and untargeted rework after authoritative changes
    files:
      - core/workflow.md
      - core/contracts.md
      - core/qa.md
      - SKILL.md
      - agents/openai.yaml
      - references/delivery-integrity.md
      - references/qa.md
      - profiles/channels/amazon-jp.md
      - evals/delivery-integrity.md
  - id: executable-gates-v0.2.5
    purpose: prevent self-certified PASS by computing module-budget, approval-provenance, module-origin, transform-authorization, asset-slot, and parity gates from a machine-readable Project State Manifest
    files:
      - core/workflow.md
      - core/contracts.md
      - core/manifest.yaml
      - SKILL.md
      - agents/openai.yaml
      - references/executable-gates.md
      - profiles/channels/amazon-jp.md
      - data/channel-policy-limits.json
      - templates/project-state.example.json
      - scripts/validate_project_state.py
      - scripts/selftest_project_state_validator.py
      - scripts/validate_overlay.py
      - scripts/package_skill.py
      - evals/executable-gates.md
  - id: independent-evidence-auditor-v0.2.6
    purpose: separate planner Candidate State from real-artifact Evidence State by independently recomputing physical file identity, provenance, exact-hash approval, semantic visual role, and required asset-set completeness before final asset binding and Demo Assembly
    files:
      - ../listing-evidence-auditor/SKILL.md
      - ../listing-evidence-auditor/agents/openai.yaml
      - ../listing-evidence-auditor/references/audit-contract.md
      - ../listing-evidence-auditor/scripts/fingerprint_assets.py
      - ../listing-evidence-auditor/scripts/reconcile_evidence.py
      - ../listing-evidence-auditor/scripts/selftest_auditor.py
      - core/workflow.md
      - core/contracts.md
      - core/qa.md
      - SKILL.md
      - agents/openai.yaml
      - references/qa.md
      - templates/project-state.example.json
      - scripts/validate_project_state.py
      - scripts/selftest_project_state_validator.py
      - scripts/validate_overlay.py
      - scripts/package_skill.py
      - evals/evidence-auditor.md
      - ../../../scripts/package_codex_bundle.py
update_policy:
  - review upstream changelog
  - update snapshot in a feature branch
  - preserve or deliberately revise documented distribution patches
  - run standalone, Japan, channel, cross-category, frontend-fidelity, delivery-integrity, executable-gate, and evidence-auditor evals
  - run both project-state and evidence-auditor self-tests
  - release only after CI passes
runtime_dependency: none
