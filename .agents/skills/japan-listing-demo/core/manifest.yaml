distribution: standalone
distribution_version: 0.2.1
upstream:
  repository: heymio/gtm-listing-demo
  version: 0.2.0
  commit: b882526f5a683235d30f562006cf1984a9f0d9f9
snapshot_scope:
  - workflow
  - contracts
  - market-research
  - localization
  - visual-evidence
  - qa
  - category-template
  - core-evals
distribution_patches:
  - id: continuous-execution-v0.2.1
    purpose: treat normal workflow gates as internal checks and continue automatically to the user-requested deliverable unless an explicit checkpoint or Hard Blocker applies
    files:
      - core/workflow.md
      - SKILL.md
      - agents/openai.yaml
update_policy:
  - review upstream changelog
  - update snapshot in a feature branch
  - preserve or deliberately revise documented distribution patches
  - run standalone, Japan, channel, and cross-category evals
  - release only after CI passes
runtime_dependency: none
