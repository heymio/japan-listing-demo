asset_id: AMZ-G1

role:
  channel: amazon-jp
  region: gallery
  slot: G1
  asset_type: gallery-native

objective:
  shopper_task: Understand one primary purchase reason quickly
  primary_message: Evidence-backed primary message

strategy_context:
  consumer_barrier: Main barrier this asset should resolve
  core_tension: Strategic tension from the Creative Strategy Kernel
  proof_principle: Show the message through a direct evidence object when possible

evidence:
  allowed:
    - confirmed product fact
  forbidden:
    - unsupported superlative

evidence_mode: SOURCE_FAITHFUL

product_sources:
  identity_required:
    - SRC-P01
  proof_required: []

benchmark:
  references:
    - BENCH-01
  learn_from:
    - composition
    - lighting
    - hierarchy
  reuse_asset: false

composition:
  product_role: hero
  environment: project-defined realistic context
  information_density: low
  one_image_focus: true

set_context:
  page_visual_direction:
    asset_id: AMZ-G1
    visual_role: hero-positioning
    scene_family: clean-product-stage
    composition_family: centered-hero
    tone: bright-neutral
    product_scale: large
    proof_form: source-faithful-product
  nearest_neighbors:
    - asset_id: AMZ-G2
      scene_family: realistic-home
      composition_family: wide-lifestyle
      tone: warm-natural
      product_scale: medium
      proof_form: lifestyle

output:
  aspect_ratio: "1:1"
  final_role: Amazon Gallery
  quantity: 1

must_preserve:
  - exact product geometry
  - exact product color/material

must_not_generate:
  - workflow diagram
  - production plan
  - fictional product structure
